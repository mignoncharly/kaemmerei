name: Phase 1 verification foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  document-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install maintained ClamAV engine and current official definitions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          AV_DB="/tmp/ohvr-av-${GITHUB_RUN_ID}"
          sudo install -d -m 755 -o clamav -g clamav "$AV_DB"
          sudo freshclam --stdout --datadir="$AV_DB" --log="$AV_DB/update.log"
          echo "CLAMAV_EXECUTABLE=$(command -v clamscan)" >> "$GITHUB_ENV"
          echo "CLAMAV_DATABASE_DIR=$AV_DB" >> "$GITHUB_ENV"
      - name: Verify actual clean and infected scans with freshness enforcement
        env:
          REQUIRE_REAL_CLAMAV: '1'
        run: python -m pytest tests/test_phase5.py -q -k real_clamav --junitxml=.verification/phase5-scanner.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-scanner-verification
          path: |
            .verification/phase5-scanner.json
            .verification/phase5-scanner.xml
  native-postgresql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Native manager unit safety checks
        run: python -m unittest tests.test_native_database -v
      - name: Provision and verify native PostgreSQL without Docker
        shell: bash
        run: |
          set -euo pipefail
          PG_BIN="$(pg_config --bindir)"
          export OHVR_NATIVE_BIN="$PG_BIN"
          trap 'python scripts/native_test_database.py stop --bin "$OHVR_NATIVE_BIN"' EXIT
          mkdir -p .verification
          python scripts/native_test_database.py start --bin "$PG_BIN" > .verification/native-connection.json
          export TEST_POSTGRES_ADMIN_URL="$(python -c 'import json; print(json.load(open(".verification/native-connection.json"))["url"])')"
          export PGPASSFILE="$(python -c 'import json; print(json.load(open(".verification/native-connection.json"))["passfile"])')"
          python scripts/verify_phase1.py --database postgresql
          python -m pytest -q --database postgresql --junitxml=.verification/native-postgresql-pytest.xml
          python -m pytest -q -m postgresql --database postgresql
          python -m pytest -q tests/test_phase4.py --database postgresql
          python -m pytest -q tests/test_phase5.py --database postgresql
          python -m pytest -q tests/test_phase6.py --database postgresql --junitxml=.verification/phase6-native.xml
          python -m pytest -q tests/test_phase7.py --database postgresql --junitxml=.verification/phase7-native.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-postgresql-verification
          path: |
            .verification/phase1-postgresql.json
            .verification/native-postgresql-pytest.xml
            .verification/phase6-native.xml
            .verification/phase7-native.xml
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_phase1.py --database sqlite
      - run: python -m pytest -q --database sqlite --junitxml=.verification/sqlite-pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-verification
          path: |
            .verification/phase1-sqlite.json
            .verification/sqlite-pytest.xml
  postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://ohvr_verify:synthetic-ci-only@127.0.0.1:5432/postgres
      TEST_POSTGRES_BOOTSTRAP_URL: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      VERIFICATION_DATABASE: postgresql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install matching PostgreSQL 18 backup and restore client
        run: |
          set -euo pipefail
          # Ubuntu's default major need not match the PostgreSQL 18 service.
          # Use the PostgreSQL project's signed repository, not an unsigned mirror.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/ohvr-pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          /usr/lib/postgresql/18/bin/pg_restore --version
      - name: Create restricted disposable-database test role
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres", autocommit=True) as connection:
              connection.execute("CREATE ROLE ohvr_verify LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'synthetic-ci-only'")
          PY
      - run: python scripts/verify_phase1.py --database postgresql
      - run: python -m pytest -q --database postgresql --junitxml=.verification/postgresql-pytest.xml
      - run: python -m pytest -q -m postgresql --database postgresql
      - name: Phase 4 workflow and archive races under restricted PostgreSQL logins
        run: python -m pytest -q tests/test_phase4.py --database postgresql
      - name: Phase 5 document lifecycle and recovery under restricted PostgreSQL logins
        run: python -m pytest -q tests/test_phase5.py --database postgresql
      - name: Phase 6 snapshots, publication and token regression under restricted PostgreSQL logins
        run: python -m pytest -q tests/test_phase6.py --database postgresql --junitxml=.verification/phase6-postgresql.xml
      - name: Phase 7 recorded history, calendar and Excel under restricted PostgreSQL logins
        run: python -m pytest -q tests/test_phase7.py --database postgresql --junitxml=.verification/phase7-postgresql.xml
      - name: Publish safe failed-test classifications
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('.verification/postgresql-pytest.xml')
          if path.exists():
              for case in ET.parse(path).iter('testcase'):
                  for issue in list(case.findall('failure'))+list(case.findall('error')):
                      body=issue.text or ''
                      reason='application assertion or fixture failure; inspect private job log'
                      for needle,label in (
                          ('Matching PostgreSQL dump/restore client required','matching client missing'),
                          ('Install the PostgreSQL client matching','client major mismatch'),
                          ('pg_dump','PostgreSQL dump command failed'),
                          ('pg_restore','PostgreSQL restore command failed')):
                          if needle in body:reason=label;break
                      # Emit only repository test identifiers and fixed classifications.
                      print('::error::'+case.get('classname','')+'.'+case.get('name','')+': '+reason)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-verification
          path: |
            .verification/phase1-postgresql.json
            .verification/postgresql-pytest.xml
            .verification/phase6-postgresql.xml
            .verification/phase7-postgresql.xml
